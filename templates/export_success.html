<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PDF Ready - ComicCraft
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="container success-page">

    <h1>
        PDF Ready!
    </h1>


    <p>
        Your ComicCraft comic has been
        successfully converted into a PDF.
    </p>


    <a
        href="{{ pdf_file }}"
        class="download-button"
    >
        Download Comic PDF
    </a>


    <br><br>


    <a
        href="/"
        class="back-link"
    >
        Create Another Comic
    </a>

</div>

</body>

</html>
