<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ComicCraft</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="container">

    <div class="hero">

        <h1>ComicCraft</h1>

        <p>
            Create your own comic story with AI.
        </p>

    </div>


    <form
        action="/generate"
        method="post"
    >

        <label>
            Story Prompt
        </label>

        <textarea
            name="story_prompt"
            placeholder="A brave girl discovers a mysterious forest..."
            required
        ></textarea>


        <label>
            Main Character
        </label>

        <input
            type="text"
            name="character"
            placeholder="Maya"
            required
        >


        <label>
            Setting
        </label>

        <input
            type="text"
            name="setting"
            placeholder="Enchanted Forest"
            required
        >


        <label>
            Tone
        </label>

        <select name="tone">

            <option value="adventure">
                Adventure
            </option>

            <option value="funny">
                Funny
            </option>

            <option value="dramatic">
                Dramatic
            </option>

            <option value="emotional">
                Emotional
            </option>

        </select>


        <label>
            Art Style
        </label>

        <select name="art_style">

            <option value="anime">
                Anime
            </option>

            <option value="comic book">
                Comic Book
            </option>

            <option value="cartoon">
                Cartoon
            </option>

            <option value="fantasy">
                Fantasy
            </option>

        </select>


        <button type="submit">
            Generate Comic Story
        </button>

    </form>

</div>

</body>

</html>
